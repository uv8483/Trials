<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        ul {
            padding-left: 20px;
        }
        a {
            color: #0033cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card" id="profile-card">
        <!-- JavaScript will fill this in -->
    </div>

    <script>
        // 1. Store your info here
        const myProfile = {
          about: "Hi there! I'm a student passionate about technology, coding, and building cool projects.",
            education: "A 11th grader",
            instagramIds: ["@larp6s", "@ofcc_uv"]
        };

        // 2. Select the container where the content will go
        const card = document.getElementById('profile-card');

        // 3. Generate the HTML dynamically using JavaScript
        card.innerHTML = `
            <h1>About Me</h1>
            <p>${myProfile.about}</p>
            
            <h2>Education</h2>
            <p>${myProfile.education}</p>
            
            <h2>Instagram IDs</h2>
            <ul>
                ${myProfile.instagramIds.map(id => `<li><a href="https://instagram.com/${id.replace('@', '')}" target="_blank">${id}</a></li>`).join('')}
            </ul>
        `;
    </script>
</body>
</html>
